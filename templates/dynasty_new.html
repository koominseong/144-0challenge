<!-- templates/dynasty_new.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새 구단 창단 - KBO Dynasty</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
    background: #0f1419;
    color: #e6e6e6;
    min-height: 100vh;
}

.header {
    text-align: center;
    padding: 45px 20px 30px;
}

.header h1 {
    font-size: 30px;
    color: #fff;
}

.header .sub {
    margin-top: 10px;
    font-size: 14px;
    color: #8899a6;
}

.container {
    max-width: 560px;
    margin: 0 auto;
    padding: 10px 20px 60px;
}

.form-card {
    background: #1a222c;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 30px;
}

.field {
    margin-bottom: 24px;
}

.field label {
    display: block;
    font-size: 14px;
    color: #8899a6;
    margin-bottom: 8px;
    font-weight: 600;
}

.field input[type="text"] {
    width: 100%;
    padding: 13px 15px;
    font-size: 15px;
    color: #fff;
    background: #0f1419;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
}

.field input[type="text"]:focus {
    border-color: #1a5276;
}

.logo-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
}

.logo-option {
    font-size: 26px;
    text-align: center;
    padding: 10px 0;
    background: #0f1419;
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
}

.logo-option:hover {
    transform: scale(1.08);
}

.logo-option.selected {
    border-color: #ffd54f;
    background: rgba(255,213,79,0.08);
}

.color-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
}

.color-option {
    height: 40px;
    border-radius: 8px;
    border: 3px solid transparent;
    cursor: pointer;
    transition: transform 0.1s;
}

.color-option:hover {
    transform: scale(1.08);
}

.color-option.selected {
    border-color: #fff;
}

.preview {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #1a5276, #0f1419);
    border: 1px solid rgba(255,255,255,0.1);
}

.preview .p-logo { font-size: 38px; }
.preview .p-name { font-size: 19px; font-weight: bold; color: #fff; }
.preview .p-stadium { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 3px; }

.btn-create {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #1a5276, #2c3e50);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.2s;
}

.btn-create:hover { opacity: 0.88; }

.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #566573;
    font-size: 14px;
    text-decoration: none;
}

.back-link:hover { color: #8899a6; }
</style>
</head>
<body>

<div class="header">
    <h1>🏟 새 구단 창단</h1>
    <div class="sub">구단 이름, 로고, 색상, 홈구장을 정하세요</div>
</div>

<div class="container">
    <form method="POST" action="{{ url_for('dynasty.dynasty_new') }}" class="form-card" id="createForm">

        <div class="preview" id="preview">
            <div class="p-logo" id="pLogo">⚾</div>
            <div>
                <div class="p-name" id="pName">구단 이름</div>
                <div class="p-stadium" id="pStadium">홈구장</div>
            </div>
        </div>

        <div class="field">
            <label>구단 이름</label>
            <input type="text" name="team_name" id="teamName" placeholder="예: 서울 슈퍼스타즈" maxlength="20" required>
        </div>

        <div class="field">
            <label>로고</label>
            <div class="logo-grid" id="logoGrid"></div>
            <input type="hidden" name="logo" id="logoInput" value="⚾">
        </div>

        <div class="field">
            <label>팀 컬러</label>
            <div class="color-grid" id="colorGrid"></div>
            <input type="hidden" name="color" id="colorInput" value="#1a5276">
        </div>

        <div class="field">
            <label>홈구장 (비우면 자동 생성)</label>
            <input type="text" name="stadium" id="stadiumName" placeholder="예: 잠실 드림파크" maxlength="20">
        </div>

        <div class="field">
            <label>비밀번호 (비우면 보호 없음)</label>
            <input type="password" name="password" placeholder="이 세이브에 접근할 비밀번호" maxlength="30">
        </div>

        <button type="submit" class="btn-create">⚾ 창단하고 드래프트 시작</button>
    </form>

    <a href="{{ url_for('dynasty.dynasty_home') }}" class="back-link">← 홈으로 돌아가기</a>
</div>

const LOGOS = ["⚾","🐯","🦁","🐻","🐉","🦅","🕊️","🦄","⚓","🔥","⚡","🐋","🌊","🌟","👑","🛡️"];
