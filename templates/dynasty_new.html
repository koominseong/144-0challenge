<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>새 구단 창단</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{

background:#0f172a;
color:white;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

}

.card{

width:700px;

background:#1e293b;

padding:40px;

border-radius:20px;

}

h1{

text-align:center;

margin-bottom:35px;

}

label{

display:block;

margin-top:20px;

margin-bottom:8px;

font-size:18px;

}

input,
select{

width:100%;

padding:14px;

border:none;

border-radius:10px;

font-size:17px;

}

button{

margin-top:35px;

width:100%;

padding:18px;

border:none;

border-radius:15px;

background:#2563eb;

color:white;

font-size:20px;

font-weight:bold;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

.preview{

margin-top:30px;

padding:25px;

border-radius:15px;

background:#334155;

text-align:center;

}

.logo{

font-size:70px;

margin-bottom:10px;

}

</style>

</head>

<body>

<div class="card">

<h1>

🏆 새 구단 창단

</h1>

<form
action="/dynasty/create"
method="post">

<label>

구단 이름

</label>

<input

name="team_name"

id="team"

placeholder="예 : 서울 드래곤즈"

required

oninput="updatePreview()">

<label>

엠블럼

</label>

<select

name="logo"

id="logo"

onchange="updatePreview()">

<option>🐲</option>

<option>🦅</option>

<option>🐯</option>

<option>🦁</option>

<option>🐻</option>

<option>🐺</option>

<option>🦈</option>

<option>⚡</option>

<option>🔥</option>

<option>⭐</option>

</select>

<label>

팀 컬러

</label>

<select
name="color">

<option>Blue</option>

<option>Red</option>

<option>Black</option>

<option>Green</option>

<option>Purple</option>

<option>Orange</option>

</select>

<label>

홈구장

</label>

<select
name="stadium">

<option>잠실 야구장</option>

<option>고척 스카이돔</option>

<option>대전 한화생명 볼파크</option>

<option>광주 챔피언스필드</option>

<option>사직 야구장</option>

<option>대구 라이온즈파크</option>

<option>수원 KT위즈파크</option>

<option>창원 NC파크</option>

<option>인천 랜더스필드</option>

</select>

<div
class="preview">

<div
class="logo"
id="previewLogo">

🐲

</div>

<h2
id="previewName">

서울 드래곤즈

</h2>

</div>

<button>

창단하기

</button>

</form>

</div>

<script>

function updatePreview(){

let team=document.getElementById("team").value;

let logo=document.getElementById("logo").value;

document.getElementById(
"previewLogo"
).innerHTML=logo;

if(team==""){

team="서울 드래곤즈";

}

document.getElementById(
"previewName"
).innerHTML=team;

}

</script>

</body>

</html>
