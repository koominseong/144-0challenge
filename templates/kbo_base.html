<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO PLAYER LIFE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172554,#050816 65%);color:#eef2ff;font-family:Inter,'Segoe UI',sans-serif;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{font-weight:900;letter-spacing:.08em}.brand small{display:block;color:#94a3b8;font-size:10px}.pill{padding:9px 13px;border:1px solid #334155;border-radius:999px;background:#0f172acc}.card{position:relative;z-index:1;background:#0b1224e8;border:1px solid #26334d;border-radius:22px;padding:24px;box-shadow:0 20px 60px #0006;margin-bottom:18px}.hero{padding:32px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#60a5fa;font-weight:800}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.btn{display:block;width:100%;padding:18px;border-radius:16px;border:1px solid #334155;background:#111c33;color:white;text-decoration:none;font-weight:800;cursor:pointer}.btn:hover{transform:translateY(-2px);border-color:#60a5fa}.primary{background:linear-gradient(135deg,#2563eb,#06b6d4);border:0}.danger{background:#3a1520}.stat{padding:18px;background:#0f172a;border-radius:16px;border:1px solid #26334d}.stat b{display:block;font-size:27px;margin-top:6px}.bar{height:9px;background:#1e293b;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#6366f1)}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #243047;text-align:left}.choice{min-height:130px;text-align:left}.tag{display:inline-block;padding:5px 8px;border-radius:8px;background:#172554;color:#93c5fd;font-size:12px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#cbd5e1;text-decoration:none;padding:8px 11px;border-radius:10px;background:#111827}.big{font-size:42px;font-weight:900}.ok{color:#4ade80}.warn{color:#fbbf24}.bad{color:#fb7185}@media(max-width:760px){.grid,.grid3{grid-template-columns:1fr}.wrap{padding:14px}.hero{padding:20px}.big{font-size:32px}}
.nav a:hover{color:#fff;border-color:#60a5fa}.card h1{margin-top:8px}.card h2{margin-top:0}@media(max-width:760px){.nav a{flex:1;text-align:center}}
</style></head><body><div class="wrap"><div class="top"><a class="brand" href="{{ url_for('kbo.home') }}" style="color:white;text-decoration:none">🇰🇷 KBO PLAYER LIFE<small>ONE PLAYER · ONE CAREER</small></a>{% if state %}<div class="pill">{{ state.year }} · {{ state.age }}세 · OVR {{ state.ovr }}</div>{% endif %}</div>{% block body %}{% endblock %}</div></body></html>
