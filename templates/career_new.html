<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career 시작</title><link rel="stylesheet" href="{{ url_for('static', filename='career.css') }}"></head><body><main class="wrap"><header><span class="eyebrow">CAREER MODE</span><h1>선수 커리어 생성</h1><p>국적과 소속을 선택하면 그곳에서 야구 인생이 시작됩니다.</p></header><form method="post" class="panel form"><label>선수 이름<input name="player_name" maxlength="20" placeholder="홍길동" required></label><label>국적<select name="nationality" required>{% for c in countries %}<option value="{{ c.get('country_id', c.get('code', c.get('id','KR'))) }}">{{ c.get('name', c.get('country_name','국가')) }}</option>{% endfor %}</select></label><label>리그<select name="league_id" required>{% for l in leagues %}<option value="{{ l.get('league_id') }}">{{ l.get('name', l.get('league_name','리그')) }}</option>{% endfor %}</select></label><label>팀<select name="team_id" required>{% for t in teams %}<option value="{{ t.get('team_id') }}">{{ t.get('name') }} · {{ t.get('level','') }}</option>{% endfor %}</select></label><label>포지션<select name="position"><option>SS</option><option>CF</option><option>RF</option><option>LF</option><option>2B</option><option>3B</option><option>1B</option><option>C</option><option>DH</option><option>SP</option><option>RP</option></select></label><button class="btn primary" type="submit">커리어 시작</button><script>
const leagues={{ leagues|tojson }}; const teams={{ teams|tojson }};
const leagueEl=document.querySelector('[name="league_id"]'); const teamEl=document.querySelector('[name="team_id"]');
function syncTeams(){ const id=leagueEl.value; teamEl.innerHTML=''; teams.filter(t=>t.league_id===id).forEach(t=>{const o=document.createElement('option');o.value=t.team_id;o.textContent=`${t.name} · ${t.level||''}`;teamEl.appendChild(o)}); }
leagueEl.addEventListener('change',syncTeams); syncTeams();
</script></form></main></body></html>
