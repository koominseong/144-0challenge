<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Career</title>
<link rel="stylesheet" href="{{ url_for('static', filename='career.css') }}">
</head>
<body class="career-shell">
<div class="career-bg"></div>
<header class="career-topbar">
  <a class="career-brand" href="/"><span class="brand-mark">144</span><span><b>CAREER</b><small>CREATE PLAYER</small></span></a>
  <span class="season-pill">NEW SAVE</span>
</header>
<main class="creator">
  <div class="creator-copy"><p class="eyebrow">START YOUR STORY</p><h1>BUILD YOUR<br><em>BASEBALL LIFE.</em></h1><p>국적을 고르고, 리그를 선택하고, 한 명의 선수가 세계 무대로 올라가는 과정을 직접 플레이하세요.</p></div>
  <form class="creator-card glass" method="post" action="/career/new">
    <label>PLAYER NAME<input name="name" required maxlength="30" placeholder="선수 이름"></label>
    <div class="two"><label>NATIONALITY<select name="nationality" required>{% for c in countries|default([]) %}<option value="{{ c.id|default(c) }}">{{ c.name|default(c) }}</option>{% endfor %}</select></label>
    <label>POSITION<select name="position" required><option>P</option><option>C</option><option>1B</option><option>2B</option><option>3B</option><option>SS</option><option>OF</option><option>DH</option></select></label></div>
    <label>LEAGUE<select name="league" required>{% for l in leagues|default([]) %}<option value="{{ l.id|default(l) }}">{{ l.name|default(l) }}</option>{% endfor %}</select></label>
    <label>TEAM<select name="team" required>{% for t in teams|default([]) %}<option value="{{ t.id|default(t) }}">{{ t.name|default(t) }}</option>{% endfor %}</select></label>
    <button class="primary-cta full" type="submit">START CAREER <b>→</b></button>
  </form>
</main>
</body></html>
