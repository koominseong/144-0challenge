{% extends 'kbo_base.html' %}{% block body %}<section class="card hero"><p class="eyebrow">CAREER MOMENT · {{state.age}}세</p><h1>{{event.title}}</h1><p class="muted">{{event.text}}</p><div class="grid">{% for cid,label,effect in event.choices %}<form method="post" onsubmit="if(this.dataset.submitting==='1') return false; this.dataset.submitting='1'; this.querySelector('button').disabled=true; return true;"><button class="btn choice" name="choice" value="{{cid}}"><h2>{{label}}</h2><p class="muted">{{effect}}</p></button></form>{% endfor %}</div></section>{% endblock %}
