<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시즌 결과</title><link rel="stylesheet" href="{{ url_for('static', filename='career.css') }}"></head><body><main class="wrap hero"><span class="eyebrow">{{ state.year }} SEASON COMPLETE</span><h1>시즌 종료</h1><div class="panel result"><h2>{{ state.last_result }}</h2><p>이번 시즌 선택: {{ state.last_decision or '선택 기록 없음' }}</p></div>{% if state.age >= 40 %}<form method="post" action="{{ url_for('career.next_season') }}"><button class="btn primary">은퇴하기</button></form>{% else %}<form method="post" action="{{ url_for('career.next_season') }}"><button class="btn primary">다음 시즌으로</button></form>{% endif %}<a class="btn ghost" href="{{ url_for('career.dashboard') }}">대시보드</a></main></body></html>
