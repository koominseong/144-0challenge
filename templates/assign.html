<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">

<title>포지션 배치</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
}

.player-card{
    border:1px solid #ccc;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

button{
    padding:5px 10px;
}

.dark{
    background:#121212;
    color:white;
}

.dark .player-card{
    background:#222;
    border-color:#444;
}

</style>

</head>

<body>

<h1>포지션 배치</h1>

<button onclick="toggleDarkMode()">
🌙 다크모드
</button>

<br><br>

{% for p in players %}

<div class="player-card">

<h3>
{{ p.name }}
({{ p.year }})
</h3>

<p>
가능 포지션 :
{{ p.positions | join(", ") }}
</p>

<form action="/assign_player" method="post">

<input
type="hidden"
name="player_id"
value="{{ p.id }}">

<select name="position">

{% for pos in p.positions %}
<option value="{{ pos }}">
{{ pos }}
</option>
{% endfor %}

</select>

<button type="submit">
배치
</button>

</form>

</div>

{% endfor %}

<script>

function toggleDarkMode(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
