<h1>포지션 배치</h1>

{% for p in players %}

<div style="border:1px solid #ccc;padding:10px;margin:10px;">

<h3>
{{ p.name }}
</h3>

<p>
가능 포지션 :
{{ p.positions | join(", ") }}
</p>

<form action="/assign_player" method="post">

<input
type="hidden"
name="player_id"
value="{{ p.id }}">

<select name="position">

{% for pos in p.positions %}
<option value="{{ pos }}">
{{ pos }}
</option>
{% endfor %}

</select>

<button type="submit">
배치
</button>

</form>

</div>

{% endfor %}

<a href="/next">
다음 팀으로
</a>
