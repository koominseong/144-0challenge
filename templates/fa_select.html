<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FA의 신</title>

<style>

body{
    font-family:sans-serif;
    background:#f3f6fb;
    text-align:center;
    padding:50px;
}

h1{
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    max-width:1000px;
    margin:auto;
}

.card{

    background:white;

    padding:25px;

    border-radius:16px;

    box-shadow:
    0 3px 10px rgba(0,0,0,.1);

}

.btn{

    margin-top:15px;

    border:none;

    background:#1976d2;

    color:white;

    padding:10px 18px;

    border-radius:10px;

    cursor:pointer;

}

</style>

</head>

<body>

<h1>
⭐ FA의 신
</h1>

<p>
3번째 팀을 직접 선택하세요
</p>

<br>

<div class="grid">

{% for team in teams %}

<div class="card">

<h2>
{{ team_names[team] }}
</h2>

<a href="/select_fa_team/{{ team }}">
<button class="btn">
선택
</button>
</a>

</div>

{% endfor %}

</div>

</body>
</html>
