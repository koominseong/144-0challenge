<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FA의 신</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
        180deg,
        #0f172a 0%,
        #111827 100%
    );

    color:white;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    padding:40px 20px;
}

.wrapper{

    max-width:1200px;
    margin:auto;
}

.header{

    text-align:center;
    margin-bottom:50px;
}

.badge{

    display:inline-block;

    padding:8px 18px;

    border-radius:999px;

    background:
    rgba(255,255,255,.08);

    color:#facc15;

    font-size:14px;

    margin-bottom:20px;
}

.title{

    font-size:48px;
    font-weight:800;

    margin-bottom:12px;
}

.subtitle{

    color:#94a3b8;

    font-size:18px;
}

.grid{

    display:grid;

    grid-template-columns:
    repeat(
        auto-fill,
        minmax(260px,1fr)
    );

    gap:22px;
}

.card{

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:24px;

    padding:28px;

    transition:.25s;

    text-align:center;
}

.card:hover{

    transform:
    translateY(-6px);

    border:
    1px solid rgba(250,204,21,.55);

    box-shadow:
    0 15px 40px rgba(
        250,
        204,
        21,
        .15
    );
}

.team-name{

    font-size:26px;

    font-weight:800;

    margin-bottom:10px;
}

.team-key{

    color:#94a3b8;

    font-size:14px;

    margin-bottom:20px;
}

.btn{

    width:100%;

    border:none;

    border-radius:14px;

    padding:14px;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    color:white;

    background:
    linear-gradient(
        135deg,
        #f59e0b,
        #facc15
    );

    transition:.2s;
}

.btn:hover{

    transform:scale(1.02);
}

.empty{

    text-align:center;

    color:#94a3b8;

    margin-top:40px;
}

@media(max-width:768px){

    .title{
        font-size:34px;
    }

    .subtitle{
        font-size:15px;
    }
}

</style>

</head>

<body>

<div class="wrapper">

    <div class="header">

        <div class="badge">
            ⭐ 행동 특성 발동
        </div>

        <h1 class="title">
            FA의 신
        </h1>

        <div class="subtitle">
            원하는 팀을 직접 선택할 수 있습니다
            <br>
            (모든 시대의 팀 포함)
        </div>

    </div>

    {% if teams %}

    <div class="grid">

        {% for team in teams %}

        <div class="card">

            <div class="team-name">
                {{ team.display }}
            </div>

            <div class="team-key">
                {{ team.file }}
            </div>

            <a href="/fa_pick/{{ team.id }}">

                <button class="btn">
                    이 팀 선택하기
                </button>

            </a>

        </div>

        {% endfor %}

    </div>

    {% else %}

    <div class="empty">
        선택 가능한 팀이 없습니다.
    </div>

    {% endif %}

</div>

</body>

</html>

<script>

window.addEventListener("load", () => {

    const nav =
    performance.getEntriesByType("navigation")[0];

    if(nav && nav.type === "reload"){

        window.location.href = "/";

    }

});

</script>
