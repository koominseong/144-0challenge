<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ event.title }} · Career</title><link rel="stylesheet" href="{{ url_for('static', filename='career.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='overlay-fix.css', v='20260909-overlayfix') }}">
</head><body class="career-shell"><div class="career-bg"></div><header class="career-topbar"><a class="career-brand" href="{{ url_for('career.dashboard') }}"><span class="brand-mark">144</span><span><b>CAREER EVENT</b><small>SEASON {{ p.season - 1 if p else '-' }}</small></span></a><span class="season-pill">RANDOM EVENT</span></header><main class="event-wrap"><section class="event-hero glass"><div class="event-icon">{{ event.icon or '⚾' }}</div><div><p class="eyebrow">{{ event.type|upper }} · {{ p.year if p else '' }}</p><h1>{{ event.title }}</h1><p>{{ event.desc or event.text }}</p></div></section><section class="event-card-grid">{% for c in event.options or event.choices %}<form method="post" action="{{ url_for('career.decision') }}"><button class="event-choice" type="submit" name="option_id" value="{{ c.id }}"><span class="event-choice-icon">{{ c.icon or '→' }}</span><span class="event-choice-main"><b>{{ c.label }}</b><small>{{ c.detail or c.result }}</small></span><span class="event-choice-arrow">→</span></button></form>{% endfor %}</section><p class="event-warning">선택 결과는 다음 시즌의 OVR·컨디션·명성·이적·커리어 기록에 반영됩니다.</p></main></body></html>
