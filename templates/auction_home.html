<!doctype html>
<html lang="ko">
<head>

<title>PLAYER AUCTION</title>
<style>
body{margin:0;background:#0b1020;color:#f5f7fb;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:70px auto;padding:24px;text-align:center}
.card{background:#151c31;border:1px solid #29324d;border-radius:22px;padding:35px}

<div class="wrap">

    <div class="rule">
      <b>게임 방법</b><br>
      • 총 10라운드<br>
      • 매 라운드 랜덤 선수 등장<br>
      • 100억의 가상 예산으로 영입<br>
      • AI 단장 3명과 경쟁<br>
      • 마지막에 전력 + 가성비 + 밸런스로 평가
    </div>
  </div>
</div>

</html>
