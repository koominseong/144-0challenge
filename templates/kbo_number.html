{% extends 'kbo_base.html' %}{% block body %}<section class="card"><p class="eyebrow">JERSEY ROOM</p><h1>등번호</h1><p class="muted">매 시즌 원하는 번호를 선택할 수 있습니다. 은퇴 후 구단 역사급 업적을 달성하면 현재 번호가 영구결번으로 지정될 수 있습니다.</p>{% if state.permanent_number %}<div class="card"><h2>🏆 영구결번</h2><p>{{state.permanent_number_team}} · #{{state.jersey}}번</p><p>{{state.permanent_number_reason}}</p></div>{% endif %}<form method="post" class="grid"><div><input name="jersey" type="number" min="1" max="99" value="{{state.jersey}}" style="width:100%;padding:18px;background:#111827;color:white;border:1px solid #334155;border-radius:14px;font-size:28px;text-align:center"></div><button class="btn primary">#{{state.jersey}}번 유지/변경</button></form></section>{% endblock %}
