<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    font-family:sans-serif;
}

.box{
    text-align:center;
    padding:20px;
}

.loading{
    font-size:20px;
    color:#94a3b8;
    margin-bottom:20px;
}

.team{
    font-size:52px;
    font-weight:bold;
    color:#60a5fa;
    transition:0.2s;
    word-break:keep-all;
}

/* ✨ 빛나는 애니메이션 */
@keyframes glow {
    0% {
        text-shadow: 0 0 5px #60a5fa, 0 0 10px #60a5fa;
        transform: scale(1);
    }
    50% {
        text-shadow: 0 0 20px #22d3ee, 0 0 40px #60a5fa;
        transform: scale(1.08);
    }
    100% {
        text-shadow: 0 0 5px #60a5fa, 0 0 10px #60a5fa;
        transform: scale(1);
    }
}

.glow {
    animation: glow 0.8s ease-in-out infinite;
}

/* 📱 모바일 */
@media (max-width: 768px){

    .loading{
        font-size:16px;
    }

    .team{
        font-size:34px;
    }
}

/* 📱 초소형 */
@media (max-width: 400px){

    .team{
        font-size:28px;
    }

    .loading{
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="box">
    <div class="loading">팀 선택 중...</div>
    <div class="team" id="team">두산 베어스</div>
</div>

<script>

const teams = [
    "두산 베어스",
    "LG 트윈스",
    "삼성 라이온즈",
    "KIA 타이거즈",
    "한화 이글스",
    "SSG 랜더스",
    "롯데 자이언츠",
    "KT 위즈",
    "NC 다이노스",
    "키움 히어로즈"
];

let i = 0;
const teamBox = document.getElementById("team");

// 🔄 빠르게 팀 바뀌는 효과
const interval = setInterval(() => {
    teamBox.innerText = teams[i % teams.length];
    i++;
}, 80);

// 🎯 최종 확정
setTimeout(() => {
    clearInterval(interval);

    teamBox.innerText = "{{ team_name }}";

    // ✨ 빛나는 효과 시작
    teamBox.classList.add("glow");

    setTimeout(() => {
        window.location.href = "/team_view";
    }, 1200);

}, 2000);

</script>

</body>
</html>
