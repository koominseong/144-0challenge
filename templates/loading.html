<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    font-family:sans-serif;
}

.box{
    text-align:center;
    padding:20px;
}

.loading{
    font-size:20px;
    color:#94a3b8;
    margin-bottom:20px;
}

.team{
    font-size:52px;
    font-weight:bold;
    color:#60a5fa;
    transition:0.2s;
    word-break:keep-all;
}

/* ✨ TEAM 글로우 */
@keyframes glow {
    0% {
        text-shadow: 0 0 5px #60a5fa, 0 0 10px #60a5fa;
        transform: scale(1);
    }
    50% {
        text-shadow: 0 0 20px #22d3ee, 0 0 40px #60a5fa;
        transform: scale(1.08);
    }
    100% {
        text-shadow: 0 0 5px #60a5fa, 0 0 10px #60a5fa;
        transform: scale(1);
    }
}

.glow {
    animation: glow 0.8s ease-in-out infinite;
}

/* 🔥 ALL TIME ERA 효과 */
.era{
    font-size:60px;
    font-weight:bold;
    margin-bottom:20px;
    opacity:0;
}

@keyframes eraGlow {
    0% {
        opacity:0;
        transform: scale(0.5);
        text-shadow:none;
    }
    50% {
        opacity:1;
        transform: scale(1.3);
        text-shadow: 0 0 30px #f97316, 0 0 60px #a855f7;
    }
    100% {
        opacity:1;
        transform: scale(1.1);
        text-shadow: 0 0 30px #60a5fa;
    }
}

.era.show {
    animation: eraGlow 1s ease-in-out forwards;
}

/* 📱 모바일 */
@media (max-width: 768px){

    .loading{
        font-size:16px;
    }

    .team{
        font-size:34px;
    }

    .era{
        font-size:40px;
    }
}

/* 📱 초소형 */
@media (max-width: 400px){

    .team{
        font-size:28px;
    }

    .loading{
        font-size:14px;
    }

    .era{
        font-size:32px;
    }
}

</style>
</head>

<body>

<div class="box">

    <div class="loading">팀 선택 중...</div>

    <!-- 🔥 ALL TIME 전용 -->
    <div class="era" id="eraText"></div>

    <div class="team" id="team">두산 베어스</div>

</div>

<script>

const era = "{{ era }}";

const eraText = document.getElementById("eraText");
const teamBox = document.getElementById("team");

const teams = [
    "두산 베어스",
    "LG 트윈스",
    "삼성 라이온즈",
    "KIA 타이거즈",
    "한화 이글스",
    "SSG 랜더스",
    "롯데 자이언츠",
    "KT 위즈",
    "NC 다이노스",
    "키움 히어로즈"
];

let i = 0;

// 🔄 팀 회전 효과
const interval = setInterval(() => {
    teamBox.innerText = teams[i % teams.length];
    i++;
}, 70);


// 💥 ALL TIME 모드
if (era === "all_time") {

    setTimeout(() => {

        clearInterval(interval);

        // 🔥 ERA 등장
        eraText.innerText = "ALL TIME ERA";
        eraText.classList.add("show");

        setTimeout(() => {

            teamBox.innerText = "{{ team_name }}";
            teamBox.classList.add("glow");

            setTimeout(() => {
                window.location.href = "/team_view";
            }, 1200);

        }, 1200);

    }, 1500);


// ⚡ 일반 모드
} else {

    setTimeout(() => {

        clearInterval(interval);

        teamBox.innerText = "{{ team_name }}";
        teamBox.classList.add("glow");

        setTimeout(() => {
            window.location.href = "/team_view";
        }, 1200);

    }, 2000);
}

</script>

</body>
</html>
