<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Career Mode · 144-0 Challenge{% endblock %}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0} :root{--bg:#080d16;--panel:rgba(18,27,42,.82);--line:rgba(148,163,184,.14);--text:#f8fafc;--muted:#8fa0b7;--blue:#60a5fa;--cyan:#22d3ee;--gold:#facc15;--green:#34d399;--red:#fb7185}
body{min-height:100vh;color:var(--text);font-family:Pretendard,'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:radial-gradient(circle at 15% 0%,rgba(34,211,238,.12),transparent 28%),radial-gradient(circle at 90% 8%,rgba(96,165,250,.14),transparent 30%),linear-gradient(145deg,#070b12,#101827 55%,#080d16);}
a{text-decoration:none;color:inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:auto;padding:22px 0 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.brand{font-weight:900;letter-spacing:-.5px}.brand b{background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;color:transparent}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{font-size:13px;color:#b9c5d6;border:1px solid var(--line);background:rgba(255,255,255,.035);padding:9px 12px;border-radius:10px}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;padding:32px;background:linear-gradient(135deg,rgba(30,41,59,.9),rgba(15,23,42,.7));box-shadow:0 22px 70px rgba(0,0,0,.28)}.hero:after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;right:-110px;top:-150px;background:rgba(34,211,238,.12);filter:blur(5px)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.7px;color:var(--cyan);text-transform:uppercase}.title{font-size:clamp(30px,5vw,54px);line-height:1.05;letter-spacing:-2px;margin:9px 0 12px}.subtitle{color:var(--muted);line-height:1.7}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:16px;box-shadow:0 14px 45px rgba(0,0,0,.22);backdrop-filter:blur(12px)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}.section-head h2{font-size:19px}.section-head p{font-size:13px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.stat{padding:18px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:15px}.stat-label{font-size:10px;color:#7f90a7;font-weight:900;letter-spacing:1px}.stat-value{font-size:27px;font-weight:900;margin-top:7px}.stat-small{font-size:12px;color:var(--muted);margin-top:5px}.player-head{display:flex;align-items:center;justify-content:space-between;gap:24px}.identity{display:flex;align-items:center;gap:16px}.avatar{width:68px;height:68px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,#1d4ed8,#0891b2);box-shadow:0 12px 30px rgba(34,211,238,.16)}.ovr-box{min-width:112px;text-align:center;border:1px solid rgba(96,165,250,.3);border-radius:18px;padding:13px;background:rgba(96,165,250,.07);position:relative;z-index:2}.ovr{font-size:48px;font-weight:1000;line-height:1;background:linear-gradient(180deg,#fff,#93c5fd);-webkit-background-clip:text;color:transparent}.ovr-label{font-size:9px;font-weight:900;color:#91a4bd;letter-spacing:1.4px;margin-top:6px}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.badge{padding:5px 9px;border-radius:8px;font-size:11px;font-weight:800;background:rgba(34,211,238,.1);color:#9cecf7;border:1px solid rgba(34,211,238,.18)}.badge.gray{color:#b8c3d2;background:rgba(255,255,255,.045);border-color:var(--line)}label{font-size:12px;font-weight:800;color:#aebbd0}input,select{display:block;width:100%;margin-top:8px;border:1px solid var(--line);background:#0b1320;color:#fff;border-radius:12px;padding:13px 14px;outline:none}input:focus,select:focus{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 3px rgba(34,211,238,.08)}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-flex;justify-content:center;align-items:center;padding:13px 17px;border-radius:12px;font-weight:900;font-size:13px;background:linear-gradient(135deg,#2563eb,#0891b2);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 28px rgba(37,99,235,.16)}.btn.alt{background:rgba(255,255,255,.05);box-shadow:none}.choice{width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.035);color:#fff;border-radius:16px;padding:19px;margin-top:11px;cursor:pointer;transition:.18s}.choice:hover{transform:translateY(-2px);border-color:rgba(34,211,238,.38);background:rgba(34,211,238,.06)}.choice-title{font-size:16px;font-weight:900}.choice-desc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}th{color:#8292a8;background:rgba(255,255,255,.025);font-size:10px;letter-spacing:.8px}td{color:#d8e0eb}.highlight{font-weight:900;color:#8bdcff}.timeline-dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);display:inline-block;box-shadow:0 0 16px rgba(34,211,238,.65)}.empty{text-align:center;padding:40px;color:#68778c}.danger{color:#fda4af}.muted{color:var(--muted)}
@media(max-width:760px){.wrap{width:min(100% - 20px,1120px);padding-top:12px}.topbar{align-items:flex-start}.nav a{padding:8px 9px}.hero{padding:23px 19px}.card{padding:18px}.grid,.grid3,.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.player-head{align-items:flex-start}.ovr-box{min-width:88px}.ovr{font-size:38px}.avatar{width:54px;height:54px;font-size:24px}.title{letter-spacing:-1.2px}}
@media(max-width:460px){.grid,.grid4{grid-template-columns:1fr}.player-head{flex-direction:column}.ovr-box{width:100%}.section-head{align-items:flex-start;flex-direction:column}}
</style>
{% block extra_head %}{% endblock %}
</head><body><main class="wrap"><header class="topbar"><a class="brand" href="{{ url_for('career.home') }}">⚾ <b>144-0</b> CAREER</a><nav class="nav"><a href="{{ url_for('career.home') }}">커리어</a><a href="{{ url_for('career.timeline') }}">타임라인</a><a href="/">메인으로</a></nav></header>{% block content %}{% endblock %}</main></body></html>
