<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<title>결과</title>

<style>

body{

    margin:0;

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a
    );

    color:white;

    font-family:sans-serif;
}

.title{

    text-align:center;

    padding:50px;

    font-size:60px;

    font-weight:900;
}

.winner{

    color:#fbbf24;
}

.container{

    display:flex;

    gap:30px;

    padding:40px;

    justify-content:center;
}

.team{

    width:500px;

    background:#1e293b;

    border-radius:30px;

    padding:30px;
}

.name{

    font-size:40px;

    font-weight:900;

    margin-bottom:30px;
}

.stat{

    margin:15px 0;

    font-size:22px;
}

.event{

    margin-top:30px;

    padding:20px;

    background:#334155;

    border-radius:20px;
}

</style>

</head>

<body>

<div class="title">

🏆 승자 :

<span class="winner">

{{ winner }}팀

</span>

</div>

<div class="container">

<div class="team">

<div class="name">

🔵 A팀

</div>

<div class="stat">

컨디션 :

{{ form_a }}

</div>

<div class="event">

{{ event_a.name }}

<br><br>

{{ event_a.desc }}

</div>

</div>

<div class="team">

<div class="name">

🔴 B팀

</div>

<div class="stat">

컨디션 :

{{ form_b }}

</div>

<div class="event">

{{ event_b.name }}

<br><br>

{{ event_b.desc }}

</div>

</div>

</div>

</body>
</html>
