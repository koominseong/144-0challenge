<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draft 설정</title><style>*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eef2ff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(720px,94vw);padding:32px;background:#131b2e;border:1px solid #2b395a;border-radius:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{padding:18px;background:#0d1425;border-radius:14px}h1{margin:0 0 6px}.muted{color:#9aa8c5;margin-bottom:25px}label{display:flex;justify-content:space-between;margin:13px 0}input{width:120px;padding:9px;border-radius:8px;border:1px solid #3b4867;background:#101827;color:white}button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:11px;background:#4d7cff;color:white;font-size:17px;font-weight:800}.err{background:#5a2030;padding:12px;border-radius:10px;margin-bottom:15px}.total{text-align:center;margin-top:14px;padding:13px;background:#111a2e;border-radius:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>⚔️ DRAFT</h1><div class="muted">KBO 역대 선수 180명 기반 1 vs 1 선수 경매</div>{% if error %}<div class="err">{{error}}</div>{% endif %}<form method="post" action="{{url_for('draft.start',save_id=save_id)}}"><div class="grid"><div class="box"><b>플레이어</b><label>PLAYER A <input name="player_a" value="{{form.get('player_a','PLAYER A') if form else 'PLAYER A'}}"></label><label>PLAYER B <input name="player_b" value="{{form.get('player_b','PLAYER B') if form else 'PLAYER B'}}"></label></div><div class="box"><b>초기 자본</b><label>달러 <input type="number" min="1" name="money" value="{{form.get('money',20) if form else 20}}"></label><div class="muted" style="font-size:13px;margin:0">입찰 단위 $1 · ALL-IN 지원</div></div></div><div class="box" style="margin-top:14px"><b>최종 보유 인원 기준</b><label>투수 <input class="n" type="number" min="0" name="pitchers" value="2"></label><label>내야수 <input class="n" type="number" min="0" name="infielders" value="2"></label><label>외야수 <input class="n" type="number" min="0" name="outfielders" value="2"></label><label>포수 <input class="n" type="number" min="0" name="catchers" value="1"></label><div class="total">선수풀 <b id="total">14</b>명</div></div><button>🎲 랜덤 경매 시작</button></form></main><script>const ns=[...document.querySelectorAll('.n')];function c(){document.getElementById('total').textContent=ns.reduce((a,e)=>a+(+e.value||0),0)*2}ns.forEach(x=>x.oninput=c);c()</script></body></html>
