{% extends 'kbo_base.html' %}{% block body %}<section class="card"><p class="eyebrow">PLAYER CREATION</p><h1>KBO 신인 만들기</h1><p class="muted">선수만 먼저 만들고 드래프트를 진행합니다. 에이전트는 <b>프로 데뷔 후 직접 선택</b>하며, 커리어 중 언제든지 변경할 수 있습니다.</p><form method="post" class="grid"><div><label>선수 이름</label><input name="name" value="신인" style="width:100%;padding:15px;margin:8px 0 18px;background:#111827;color:white;border:1px solid #334155;border-radius:12px"></div><div><label>등번호</label><input name="jersey" type="number" min="1" max="99" value="1" style="width:100%;padding:15px;margin:8px 0 18px;background:#111827;color:white;border:1px solid #334155;border-radius:12px"></div><div><label>포지션</label><select name="position" style="width:100%;padding:15px;margin:8px 0 18px;background:#111827;color:white;border:1px solid #334155;border-radius:12px">{% for k,v in positions.items() %}<option value="{{k}}">{{v}}</option>{% endfor %}</select></div><div><label>출신</label><select name="school" style="width:100%;padding:15px;margin:8px 0 18px;background:#111827;color:white;border:1px solid #334155;border-radius:12px"><option value="high">고졸</option><option value="college">대졸</option></select></div><div><label>타격</label><select name="bats" style="width:100%;padding:15px;margin:8px 0 18px;background:#111827;color:white;border:1px solid #334155;border-radius:12px"><option>R</option><option>L</option><option>S</option></select></div><button class="btn primary" style="grid-column:1/-1">드래프트 참가하기 →</button></form></section>{% endblock %}
