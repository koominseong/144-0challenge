<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>144-0 Challenge</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',sans-serif;

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e293b,
    #0f172a
    );

    color:white;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    text-align:center;

    max-width:900px;

    padding:40px;
}

h1{

    font-size:72px;

    margin-bottom:20px;

    background:
    linear-gradient(
    90deg,
    #60a5fa,
    #22d3ee
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{

    font-size:24px;

    color:#cbd5e1;

    margin-bottom:50px;
}

.card{

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.1);

    border-radius:20px;

    padding:40px;

    box-shadow:
    0 10px 40px rgba(0,0,0,.4);
}

.era-buttons{

    display:flex;

    justify-content:center;

    gap:20px;

    margin-top:30px;

    flex-wrap:wrap;
}

.era-btn{

    text-decoration:none;
}

.era-btn button{

    width:220px;

    height:70px;

    border:none;

    border-radius:15px;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;
}

.btnAll{

    background:
    linear-gradient(
    135deg,
    #f97316,
    #a855f7
    );

    color:white;
}

.btnRanking{

    background:
    linear-gradient(
    135deg,
    #ffd700,
    #ff9800
    );

    color:black;
}

.era-btn button:hover{

    transform:translateY(-5px);

    box-shadow:
    0 10px 30px rgba(0,0,0,.4);
}

.info{

    margin-top:40px;

    color:#94a3b8;

    line-height:1.8;
}

.ranking-wrap{

    margin-top:35px;
}

.ranking-wrap button{

    width:300px;
    height:65px;

    border:none;

    border-radius:15px;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;
}

.ranking-wrap button:hover{

    transform:translateY(-5px);

    box-shadow:
    0 10px 30px rgba(0,0,0,.4);
}

/* 모바일 */

@media (max-width:768px){

    h1{
        font-size:42px;
    }

    .subtitle{
        font-size:16px;
    }

    .card{
        padding:20px;
    }

    .era-buttons{
        flex-direction:column;
        align-items:center;
        gap:15px;
    }

    .era-btn button{
        width:80vw;
        max-width:280px;
        height:60px;
        font-size:20px;
    }

    .ranking-wrap button{
        width:80vw;
        max-width:280px;
        height:60px;
        font-size:20px;
    }

    .info{
        font-size:14px;
    }
}

@media (max-width:400px){

    h1{
        font-size:34px;
    }

    .era-btn button,
    .ranking-wrap button{
        font-size:18px;
        height:55px;
    }
}

</style>

</head>

<body>

<div class="container">

<h1>144-0 Challenge</h1>

<p class="subtitle">
KBO 역대 최고의 드림팀을 만들어라
</p>

<div class="card">

<h2>게임 선택</h2>

<div class="era-buttons">

<a class="era-btn" href="/start">
    <button class="btnAll">🔥 Game Start</button>
</a>

<a class="era-btn" href="/pvp_start">
    <button class="btnAll">
        ⚔️ 1vs1 Battle
    </button>
</a>

<a class="era-btn" href="/classic_start">
    <button class="btnAll">
        Classic Mode
    </button>
</a>

</div>

<div class="ranking-wrap">

<a href="/ranking">
    <button class="btnRanking">
        🏆 명예의 전당
    </button>
</a>

</div>

<div class="info">

<p>• 각 팀에서 3명의 선수 선택</p>
<p>• 총 15인 로스터 완성</p>
<p>• 최대 144승까지 가능</p>
<p>• 팀 리롤 2회 제공</p>
<p>• 랭킹에 기록 저장 가능</p>

</div>

</div>

</div>

</body>
</html>
