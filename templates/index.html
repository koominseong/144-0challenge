<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">

<title>144-0 Challenge</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',sans-serif;

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e293b,
    #0f172a
    );

    color:white;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    text-align:center;

    max-width:900px;

    padding:40px;
}

h1{

    font-size:72px;

    margin-bottom:20px;

    background:
    linear-gradient(
    90deg,
    #60a5fa,
    #22d3ee
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{

    font-size:24px;

    color:#cbd5e1;

    margin-bottom:50px;
}

.card{

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.1);

    border-radius:20px;

    padding:40px;

    box-shadow:
    0 10px 40px rgba(0,0,0,.4);
}

.era-buttons{

    display:flex;

    justify-content:center;

    gap:20px;

    margin-top:30px;

    flex-wrap:wrap;
}

.era-btn{

    text-decoration:none;
}

.era-btn button{

    width:220px;

    height:70px;

    border:none;

    border-radius:15px;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;
}

.btn2000{

    background:
    linear-gradient(
    135deg,
    #f43f5e,
    #f97316
    );

    color:white;
}

.btn2010{

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );

    color:white;
}

.btn2020{

    background:
    linear-gradient(
    135deg,
    #16a34a,
    #22c55e
    );

    color:white;
}

.btnAll{

    background:
    linear-gradient(
    135deg,
    #f97316,
    #a855f7
    );

    color:white;
}

.era-btn button:hover{

    transform:translateY(-5px);

    box-shadow:
    0 10px 30px rgba(0,0,0,.4);
}

.info{

    margin-top:40px;

    color:#94a3b8;

    line-height:1.8;
}

</style>

</head>

<body>

<div class="container">

<h1>144-0 Challenge</h1>

<p class="subtitle">
KBO 역대 최고의 드림팀을 만들어라
</p>

<div class="card">

<h2>시대 선택</h2>

<div class="era-buttons">

<a class="era-btn" href="/start/2000s">
    <button class="btn2000">2000s</button>
</a>

<a class="era-btn" href="/start/2010s">
    <button class="btn2010">2010s</button>
</a>

<a class="era-btn" href="/start/2020s">
    <button class="btn2020">2020s</button>
</a>

<a class="era-btn" href="/start/all_time">
    <button class="btnAll">ALL TIME</button>
</a>

</div>

<div class="info">

<p>• 각 팀에서 3명의 선수 선택</p>
<p>• 총 15인 로스터 완성</p>
<p>• 최고의 WAR 조합을 만들어 S등급에 도전</p>
<p>• 팀 리롤 1회 제공</p>

</div>

</div>

</div>

</body>

</html>
