<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업적 · CAREER</title><link rel="stylesheet" href="{{ url_for('static', filename='career.css') }}"></head><body class="career-shell"><div class="career-bg"></div><header class="career-topbar"><a class="career-brand" href="{{ url_for('career.career_home') }}"><span class="brand-mark">144</span><span><b>ACHIEVEMENTS</b><small>CAREER ACCOUNT</small></span></a><div class="top-status"><span class="season-pill">{{ unlocked_count }} / {{ total }}</span><a class="back-link" href="{{ url_for('career.career_home') }}">← 커리어</a></div></header><main class="wrap"><section class="hero"><p class="eyebrow">CAREER ACHIEVEMENTS</p><h1>나의 업적</h1><p class="muted-line">한 번 달성한 업적은 계정에 영구적으로 기록됩니다.</p></section><section class="achievement-grid">{% for a in items %}<div class="achievement-card {{ 'unlocked' if a.unlocked else 'locked' }}"><div class="achievement-icon">{{ a.icon if a.unlocked else '🔒' }}</div><div><h3>{{ a.name }}</h3><p>{{ a.desc }}</p></div><span class="achievement-status">{{ 'UNLOCKED' if a.unlocked else 'LOCKED' }}</span></div>{% endfor %}</section></main></body></html>
